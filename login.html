<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <!-- formulario -->
    <form id="login-form">
        <!-- imagen del usuario -->
        <img src="assets/img/img_usuario.png" alt="avatar de usuario">
        <!-- usuario -->
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Marta123" required>
        <!-- contraseña -->
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
        <!-- mostrar contraseña/no mostrar -->
        <div class="box-visible">
            <input type="checkbox" id="visible" name="visible">
            <label for="visible">Mostrar Contraseña</label>
        </div>
        <!-- boton de inicio -->
        <button type="submit" id="submit">Iniciar sesion</button>
    </form>
    <!-- enlace de js -->
    <script src="assets/js/login.js"></script>
</body>
</html>
