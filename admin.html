<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>panel del administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"></script>
</head>
<body>
    <!-- menu hamburguesa -->
    <header>
        <!-- logo -->
        <img class="logo" src="assets/img/logo.png" alt="logo">
        <!-- boton de abrir -->
        <button  id="abrir" class="abrir-menu"><i class="bi bi-list"></i></button>
        
        <nav class="nav" id="nav">
            <!-- boton de cerrar -->
            <button class="cerrar-menu" id="cerrar"><i class="bi bi-x-circle-fill"></i></button>
            <!-- enlaces -->
            <ul class="nav-list">
                <li><a href="#">inicio</a></li>
                <li><a href="#">inmuebles</a></li>
                <li><a href="#calendario">Calendario</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="login.html">cerrar sesión</a></li>
            </ul>
        </nav>
    </header>
    <!-- calendario -->
<main class="contenido-principal">

    <section class="seccion-calendario">

        <div class="encabezado-calendario">
            <h1>Calendario</h1>
            <p>Control de reservas y servicios de limpieza</p>
        </div>

        <!-- Controles del calendario -->
        <div class="controles-calendario">

            <div class="navegacion-fechas">
                <button id="anterior">Anterior</button>

                <h2 id="fecha-actual">Noviembre 2026</h2>

                <button id="siguiente">Siguiente</button>
            </div>

            <button id="hoy">Hoy</button>

            <!-- Selección de vista -->
            <div class="selector-vista">
                <button id="vista-mensual" class="vista-activa">
                    Mensual
                </button>

                <button id="vista-semanal">
                    Semanal
                </button>
            </div>
            <!-- Botón para exportar PDF -->
            <button type="button" id="exportar-pdf">
            <i class="bi bi-filetype-pdf"></i>
            Exportar PDF
            </button>
        </div>

        <div id="calendario" class="calendario">
        </div>

    </section>

</main>

<!-- ventana modal de los detalles de reservas y limpieza -->
<dialog id="modal-evento" class="modal-evento">

    <div class="modal-encabezado">

        <h2 id="modal-titulo">Detalles del evento</h2>
        <!-- boton de cerrar -->
        <button type="button" id="cerrar-modal">
            &times;
        </button>

    </div>

    <div class="modal-cuerpo">

        <h3 id="modal-codigo"></h3>

        <div id="modal-contenido"></div>

    </div>

</dialog>


    <!-- ventana modal de las reservas y limpieza -->
<dialog id="modal-lista-eventos" class="modal-evento">

    <div class="modal-encabezado">

        <h2>Eventos del día</h2>

        <button type="button" id="cerrar-lista-eventos">
            &times;
        </button>

    </div>

    <div class="modal-cuerpo">

        <h3 id="fecha-lista-eventos"></h3>

        <div id="contenido-lista-eventos"></div>

    </div>

</dialog>

    <script src="assets/js/admin.js"></script>
</body>
</html>
